[project]
name = "ingestion"
version = "0.1.0"
description = "ingest for database"
readme = "README.md"
authors = [
    { name = "Stanislav M", email = "stanislav.herdt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = ["shared"]

[project.scripts]
ingestion = "ingestion:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }